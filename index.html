<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Timeline prototype</title>
<style>body{margin:0;font:14px sans-serif;display:flex;height:100vh}#tl{flex:1;position:relative;overflow:hidden;cursor:grab;background:#fafafa}
#side{width:420px;overflow:auto;border-left:1px solid #ccc;padding:10px}.cols{display:flex;gap:8px}.cols>div{flex:1;background:#f0f0f0;padding:6px}
.tag{display:inline-block;background:#dde;padding:1px 5px;margin:2px;border-radius:3px;font-size:12px}canvas{display:block;touch-action:none}#close{display:none}
@media (max-width:700px){#side{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:70vh;background:#fff;box-shadow:0 -2px 10px #0004;border-left:0;border-radius:12px 12px 0 0;transform:translateY(110%);transition:transform .2s;box-sizing:border-box}#side.open{transform:none}.cols{flex-direction:column}#close{display:block;position:sticky;top:0;margin-left:auto;font-size:22px;border:0;background:#eee;border-radius:50%;width:36px;height:36px}}</style></head>
<body><div id="tl"><canvas id="c"></canvas></div><div id="side"><button id="close" aria-label="Close">&times;</button><div id="content"><h3>Timeline prototype</h3><p>Wheel = zoom, drag = pan, click a marker. Scale: log of years-before-present.</p></div>
<script src="data.js"></script><script src="app.js"></script></body></html>
