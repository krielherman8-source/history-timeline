<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Timeline prototype</title>
<style>body{margin:0;background:#000;color:#eee;font:14px sans-serif;display:flex;height:100vh;height:100dvh}#tl{flex:1;min-width:0;position:relative;overflow:hidden;cursor:grab;background:#000}
#side{width:420px;overflow:auto;border-left:1px solid #333;background:#000;padding:10px}.cols{display:flex;gap:8px}.cols>div{flex:1;background:#111;border:1px solid #333;padding:6px}
a{color:#8cf}.tag{display:inline-block;background:#223;color:#cde;padding:1px 5px;margin:2px;border-radius:3px;font-size:12px}.badge{display:inline-block;color:#000;font-weight:bold;padding:1px 7px;margin:2px;border-radius:9px;font-size:12px}.changed{background:#101820;border-left:3px solid #6cf;padding:4px 8px;margin:8px 0}figure{margin:10px 0}figure img{max-width:100%;border-radius:4px}figcaption{font-size:11px;color:#999}.vid{background:#111;padding:6px;border-radius:4px}#fbtn{position:absolute;top:10px;left:10px;z-index:5;background:#1a1a1a;color:#eee;border:1px solid #555;border-radius:18px;padding:8px 14px;font-size:14px}#filters{position:absolute;top:0;left:0;bottom:0;width:300px;max-width:88vw;background:#0b0b0b;border-right:1px solid #333;z-index:6;overflow:auto;padding:10px 12px;box-sizing:border-box;transform:translateX(-105%);transition:transform .2s}#filters.open{transform:none}#filters h4{margin:14px 0 6px;display:flex;gap:6px;align-items:center}#filters h4 button,#fall{background:#222;color:#ddd;border:1px solid #444;border-radius:4px;padding:4px 8px;font-size:12px}#filters h4 button:first-of-type{margin-left:auto}.tg label{display:block;padding:7px 2px;border-bottom:1px solid #1c1c1c}.tg input{transform:scale(1.3);margin-right:10px}#filters select{width:100%;padding:8px;background:#1a1a1a;color:#eee;border:1px solid #444}#fclose{float:right;font-size:22px;background:#222;color:#fff;border:0;border-radius:50%;width:36px;height:36px}.cnt{color:#999;font-size:12px}canvas{display:block;touch-action:none}#close{display:none}
@media (max-width:700px){#side{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:70vh;background:#000;border-top:1px solid #444;box-shadow:0 -2px 12px #fff2;border-left:0;border-radius:12px 12px 0 0;transform:translateY(110%);transition:transform .2s;box-sizing:border-box}#side.open{transform:none}.cols{flex-direction:column}#close{display:block;position:sticky;top:0;margin-left:auto;font-size:22px;border:0;background:#222;color:#fff;border-radius:50%;width:36px;height:36px}}</style></head>
<body><div id="tl"><canvas id="c"></canvas><button id="fbtn" aria-label="Filters">&#9776; Filters</button><div id="filters"><button id="fclose" aria-label="Close filters">&times;</button><h3>Filters</h3><div class="body"></div></div></div><div id="side"><button id="close" aria-label="Close">&times;</button><div id="content"><h3>Timeline prototype</h3><p>Wheel = zoom, drag = pan, click a marker. Scale: log of years-before-present.</p></div>
<script src="data.js?v=53"></script><script src="app.js?v=53"></script></body></html>
